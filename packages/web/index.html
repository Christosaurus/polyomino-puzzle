<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Polyomino-Puzzle</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg-1: #eef1f6;
        --bg-2: #dfe4ee;
        --fg: #1b1d24;
        --fg-dim: #5b6170;
        --panel: #ffffff;
        --panel-2: #f4f6fb;
        --line: #d7dce7;
        --cell: #e6e9f1;
        --board-edge: #b7c0d4;
        --accent: #4b5bd7;
        --accent-fg: #ffffff;
        --gold: #ffb300;
        --shadow: 0 10px 30px -12px rgba(20, 25, 50, 0.35);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-1: #14161c;
          --bg-2: #0e1014;
          --fg: #eef1f7;
          --fg-dim: #9aa1b2;
          --panel: #1e222b;
          --panel-2: #262b36;
          --line: #333a48;
          --cell: #2b313d;
          --board-edge: #454d5e;
          --accent: #6675f0;
          --accent-fg: #ffffff;
          --gold: #ffc24d;
          --shadow: 0 12px 34px -12px rgba(0, 0, 0, 0.6);
        }
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        color: var(--fg);
        background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
        background-attachment: fixed;
        font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        max-width: 560px;
        margin: 0 auto;
        padding: calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 14px);
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 100dvh;
      }

      button {
        font: inherit;
        font-weight: 650;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 9px 15px;
        cursor: pointer;
        transition: transform 0.08s ease;
      }
      button:active {
        transform: scale(0.96);
      }
      button.primary {
        background: var(--accent);
        color: var(--accent-fg);
        border-color: transparent;
        box-shadow: 0 6px 18px -6px var(--accent);
      }
      button.ghost {
        background: transparent;
      }

      /* ── Picker ─────────────────────────────────────────── */
      .app-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }
      .app-head h1 {
        font-size: 20px;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .app-head .stars {
        font-size: 14px;
        font-weight: 700;
        color: var(--fg-dim);
      }
      .app-head .stars b {
        color: var(--gold);
      }
      #picker-status {
        margin: 0 2px 10px;
        font-size: 13px;
        color: var(--fg-dim);
      }
      #levels {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
        gap: 10px;
      }
      .lvl {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 13px 6px 10px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
      }
      .lvl .n {
        font-size: 17px;
        font-weight: 800;
      }
      .lvl .s {
        font-size: 11px;
        letter-spacing: 1px;
        color: var(--line);
      }
      .lvl .s .on {
        color: var(--gold);
      }
      .lvl.done {
        border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
      }
      .lvl .check {
        position: absolute;
        top: -7px;
        right: -7px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        font-size: 12px;
        display: none;
        align-items: center;
        justify-content: center;
      }
      .lvl.done .check {
        display: flex;
      }

      /* ── Game ───────────────────────────────────────────── */
      #game {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #game:not([hidden]) {
        margin: auto 0;
      }
      #hud {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 8px;
      }
      #hud .lvl-tag {
        font-weight: 750;
        font-size: 15px;
      }
      #timer {
        font-variant-numeric: tabular-nums;
        font-weight: 800;
        font-size: 22px;
        letter-spacing: 0.02em;
        padding: 3px 12px;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--line);
      }
      #timer.over {
        color: #e0641c;
        border-color: color-mix(in srgb, #e0641c 40%, var(--line));
      }
      #hud .right {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
      }
      #btn-mute {
        padding: 7px 11px;
      }

      #board-wrap {
        position: relative;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow);
        overflow: hidden;
        touch-action: none;
        padding: 4px;
      }
      canvas {
        display: block;
        width: 100%;
      }
      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      #hint {
        font-size: 12.5px;
        color: var(--fg-dim);
        margin: 0;
      }

      /* ── Win card ───────────────────────────────────────── */
      #win {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: color-mix(in srgb, var(--panel) 78%, transparent);
        backdrop-filter: blur(3px);
      }
      #win.show {
        display: flex;
        animation: fade 0.25s ease both;
      }
      .win-card {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 8px 20px;
      }
      .win-card h2 {
        margin: 0;
        font-size: 26px;
        letter-spacing: -0.01em;
      }
      .win-stars {
        display: flex;
        gap: 10px;
        font-size: 40px;
        line-height: 1;
      }
      .win-stars span {
        color: var(--line);
        transform: scale(0);
        animation: starpop 0.42s cubic-bezier(0.2, 1.5, 0.4, 1) forwards;
      }
      .win-stars span.on {
        color: var(--gold);
        filter: drop-shadow(0 3px 8px color-mix(in srgb, var(--gold) 55%, transparent));
      }
      .win-stars span:nth-child(1) {
        animation-delay: 0.08s;
      }
      .win-stars span:nth-child(2) {
        animation-delay: 0.24s;
      }
      .win-stars span:nth-child(3) {
        animation-delay: 0.4s;
      }
      .win-time {
        font-size: 14px;
        color: var(--fg-dim);
        font-variant-numeric: tabular-nums;
      }
      .win-time b {
        color: var(--fg);
      }
      .win-card button {
        margin-top: 4px;
        padding: 11px 26px;
        font-size: 16px;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      @keyframes starpop {
        to {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <section id="picker">
        <div class="app-head">
          <h1>Polyomino</h1>
          <div class="stars" id="total-stars"></div>
        </div>
        <p id="picker-status">Levels werden geladen …</p>
        <div id="levels"></div>
      </section>

      <section id="game" hidden>
        <div id="hud">
          <div><button id="btn-back" class="ghost">‹ Übersicht</button></div>
          <div id="timer">0:00</div>
          <div class="right">
            <button id="btn-mute" title="Ton">🔊</button>
          </div>
        </div>

        <div id="board-wrap">
          <canvas id="canvas"></canvas>
          <div id="win">
            <div class="win-card">
              <h2>Gelöst!</h2>
              <div class="win-stars" id="win-stars"><span>★</span><span>★</span><span>★</span></div>
              <div class="win-time" id="win-time"></div>
              <button id="btn-next" class="primary">Weiter ›</button>
            </div>
          </div>
        </div>

        <div class="foot">
          <p id="hint">Antippen zum Drehen · ziehen zum Platzieren</p>
          <button id="btn-reset" class="ghost">Neu</button>
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
