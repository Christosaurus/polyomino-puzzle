<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Polyomino-Puzzle</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f4f5;
        --fg: #1c1c1e;
        --panel: #ffffff;
        --line: #d4d4d8;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #18181b;
          --fg: #f4f4f5;
          --panel: #27272a;
          --line: #3f3f46;
          --accent: #60a5fa;
        }
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overscroll-behavior: none;
      }
      #app {
        max-width: 560px;
        margin: 0 auto;
        padding: env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 12px);
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      h1 {
        font-size: 17px;
        margin: 0;
        font-weight: 600;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 14px;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.97);
      }
      button.primary {
        background: var(--accent);
        color: #fff;
        border-color: transparent;
      }
      #board-wrap {
        position: relative;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        touch-action: none;
      }
      canvas {
        display: block;
        width: 100%;
      }
      #hint {
        font-size: 13px;
        opacity: 0.65;
        text-align: center;
      }
      #levels {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
        gap: 8px;
      }
      #levels button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 10px 4px;
      }
      #levels .diff {
        font-size: 12px;
        opacity: 0.6;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .grow {
        flex: 1;
      }
      #won {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        background: color-mix(in srgb, var(--panel) 82%, transparent);
        font-size: 22px;
        font-weight: 700;
      }
      #won.show {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Polyomino-Puzzle</h1>
        <div class="row" id="game-controls" hidden>
          <button id="btn-back">Übersicht</button>
          <button id="btn-reset" class="primary">Neu</button>
        </div>
      </header>

      <section id="picker">
        <p id="picker-status">Levels werden geladen …</p>
        <div id="levels"></div>
      </section>

      <section id="game" hidden>
        <div id="board-wrap">
          <canvas id="canvas"></canvas>
          <div id="won">
            <div>Gelöst! 🎉</div>
            <button id="btn-next" class="primary">Nächstes Level</button>
          </div>
        </div>
        <p id="hint">Teil antippen zum Drehen · ziehen zum Platzieren</p>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
