<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536"><defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161018"/><stop offset="1" stop-color="#241a14"/>
    </linearGradient>
  <radialGradient id="vig" cx="0.5" cy="0.52" r="0.75">
    <stop offset="0.55" stop-color="#060810" stop-opacity="0"/>
    <stop offset="1" stop-color="#060810" stop-opacity="0.7"/>
  </radialGradient>
    </defs>
    <rect width="1024" height="1536" fill="url(#sky)"/>
    <!-- back wall of a cosy potting shed -->
    <rect x="0" y="0" width="1024" height="1120" fill="#2a1f18"/>
    <!-- plank lines -->
    <g stroke="#3a2c22" stroke-width="6">
      <path d="M0 260 H1024"/><path d="M0 520 H1024"/><path d="M0 780 H1024"/><path d="M0 1040 H1024"/>
    </g>
    <!-- window upper-right with warm lamplight -->
    <rect x="640" y="120" width="300" height="360" rx="10" fill="#3a2c22" stroke="#4a3a2c" stroke-width="12"/>
    <rect x="660" y="140" width="120" height="150" fill="#ffcf6b" opacity="0.8"/>
    <rect x="800" y="140" width="120" height="150" fill="#ffdf9a" opacity="0.7"/>
    <rect x="660" y="310" width="120" height="150" fill="#ffcf6b" opacity="0.5"/>
    <rect x="800" y="310" width="120" height="150" fill="#ffcf6b" opacity="0.4"/>
    <!-- hanging plants top-left -->
    <g stroke="#3d5c3b" stroke-width="8"><path d="M120 0 V 260"/><path d="M240 0 V 200"/></g>
    <g fill="#3d5c3b"><circle cx="120" cy="270" r="60"/><circle cx="240" cy="210" r="45"/></g>
    <!-- workbench across the bottom -->
    <rect x="0" y="1080" width="1024" height="60" fill="#4a3a2c"/>
    <rect x="0" y="1140" width="1024" height="396" fill="#1c140f"/>
    <!-- pots, jars, tools silhouettes on the bench -->
    <g fill="#3a2c22">
      <rect x="80" y="1000" width="90" height="80" rx="8"/>
      <rect x="220" y="980" width="70" height="100" rx="8"/>
      <rect x="820" y="1000" width="90" height="80" rx="10"/>
      <circle cx="420" cy="1020" r="45"/>
    </g>
    <g stroke="#5b4a3a" stroke-width="10" stroke-linecap="round"><path d="M700 1080 L740 960"/><path d="M760 1080 L800 970"/></g>
    <!-- warm dust motes -->
    <g fill="#ffdf9a" opacity="0.5"><circle cx="300" cy="600" r="5"/><circle cx="520" cy="500" r="4"/><circle cx="650" cy="700" r="5"/><circle cx="420" cy="820" r="4"/></g>
    <rect x="70" y="470" width="884" height="720" rx="48" fill="#060810" opacity="0.36"/>
    <rect width="1024" height="1536" fill="url(#vig)"/></svg>