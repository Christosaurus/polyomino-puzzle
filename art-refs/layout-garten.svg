<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1730"/>
      <stop offset="0.45" stop-color="#1a2b46"/>
      <stop offset="0.7" stop-color="#2b4552"/>
      <stop offset="1" stop-color="#274a3f"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dbe4ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#dbe4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4a34"/>
      <stop offset="1" stop-color="#132a1e"/>
    </linearGradient>
    <radialGradient id="ray" cx="0.85" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#fff3d0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff3d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.52" r="0.75">
      <stop offset="0.55" stop-color="#060810" stop-opacity="0"/>
      <stop offset="1" stop-color="#060810" stop-opacity="0.7"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect width="1024" height="1536" fill="url(#sky)"/>
  <rect width="1024" height="1536" fill="url(#ray)"/>

  <!-- stars -->
  <g fill="#e6ecff">
    <circle cx="150" cy="120" r="2.5"/><circle cx="320" cy="70" r="2"/><circle cx="520" cy="150" r="2.2"/>
    <circle cx="640" cy="90" r="1.8"/><circle cx="880" cy="330" r="2"/><circle cx="240" cy="260" r="1.8"/>
    <circle cx="430" cy="300" r="1.6"/><circle cx="770" cy="180" r="1.6"/>
  </g>

  <!-- moon -->
  <circle cx="770" cy="230" r="180" fill="url(#moonGlow)"/>
  <circle cx="770" cy="230" r="72" fill="#cfd9f2"/>

  <!-- birds -->
  <g stroke="#8b93ad" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M300 210 q22 -22 44 0 q22 -22 44 0"/>
    <path d="M540 300 q17 -17 34 0 q17 -17 34 0"/>
    <path d="M660 160 q13 -13 26 0 q13 -13 26 0"/>
  </g>

  <!-- big tree, lower-left into the top -->
  <path d="M120 1140 C 90 900 130 720 175 560 C 190 500 175 470 205 430" stroke="#4a3628" stroke-width="60" fill="none" stroke-linecap="round"/>
  <g fill="#26402d">
    <circle cx="140" cy="430" r="150"/>
    <circle cx="270" cy="360" r="160"/>
    <circle cx="360" cy="470" r="120"/>
    <circle cx="230" cy="520" r="130"/>
    <circle cx="60"  cy="560" r="120"/>
  </g>
  <g fill="#3e5c3b">
    <circle cx="300" cy="330" r="90"/>
    <circle cx="180" cy="400" r="70"/>
    <circle cx="380" cy="440" r="60"/>
  </g>

  <!-- ground -->
  <path d="M0 1120 C 200 1075 380 1160 560 1120 C 740 1085 900 1150 1024 1110 L1024 1536 L0 1536 Z" fill="url(#ground)"/>

  <!-- winding pale path -->
  <path d="M470 1536 C 500 1400 430 1320 470 1230 C 500 1170 470 1140 500 1120" stroke="#c9b58a" stroke-width="120" fill="none" stroke-linecap="round" opacity="0.55"/>

  <!-- low fence -->
  <g stroke="#6b5030" stroke-width="10" stroke-linecap="round">
    <path d="M60 1150 v40"/><path d="M110 1145 v40"/><path d="M160 1150 v40"/>
    <path d="M840 1130 v40"/><path d="M890 1135 v40"/><path d="M940 1130 v40"/>
    <path d="M60 1165 h110"/><path d="M840 1148 h110"/>
  </g>

  <!-- flower clusters near the ground -->
  <g>
    <g transform="translate(120 1230)"><path d="M0 30 V0" stroke="#3a5a3c" stroke-width="5"/><circle r="12" fill="#f2a5c6"/><circle cx="-14" cy="6" r="9" fill="#f7c8dc"/><circle cx="12" cy="8" r="9" fill="#f7c8dc"/></g>
    <g transform="translate(230 1290)"><path d="M0 34 V0" stroke="#3a5a3c" stroke-width="5"/><circle r="12" fill="#ffd66b"/><circle cx="-12" cy="8" r="8" fill="#ffe39a"/></g>
    <g transform="translate(360 1250)"><path d="M0 32 V0" stroke="#3a5a3c" stroke-width="5"/><circle r="11" fill="#9ec7ff"/><circle cx="13" cy="6" r="8" fill="#c6def7"/></g>
    <g transform="translate(520 1300)"><path d="M0 34 V0" stroke="#3a5a3c" stroke-width="5"/><circle r="12" fill="#c79bf0"/><circle cx="-13" cy="7" r="8" fill="#ddc6f7"/></g>
    <g transform="translate(660 1255)"><path d="M0 30 V0" stroke="#3a5a3c" stroke-width="5"/><circle r="11" fill="#ff9a7a"/><circle cx="12" cy="6" r="8" fill="#ffc3ac"/></g>
    <g transform="translate(790 1300)"><path d="M0 34 V0" stroke="#3a5a3c" stroke-width="5"/><circle r="12" fill="#fbe08a"/></g>
    <g transform="translate(900 1245)"><path d="M0 30 V0" stroke="#3a5a3c" stroke-width="5"/><circle r="11" fill="#f2a5c6"/><circle cx="-12" cy="6" r="8" fill="#f7c8dc"/></g>
    <g transform="translate(300 1340)"><path d="M0 26 V0" stroke="#3a5a3c" stroke-width="5"/><circle r="10" fill="#ffffff"/></g>
    <g transform="translate(600 1360)"><path d="M0 26 V0" stroke="#3a5a3c" stroke-width="5"/><circle r="10" fill="#9ec7ff"/></g>
  </g>

  <!-- garden lantern (unlit) -->
  <g transform="translate(150 1160)">
    <path d="M0 40 V-10" stroke="#4a4038" stroke-width="8"/>
    <rect x="-16" y="-46" width="32" height="40" rx="6" fill="#3a3630" stroke="#5b5148" stroke-width="4"/>
  </g>

  <!-- moths / butterflies mid-frame -->
  <g fill="#b7a3d6" opacity="0.9">
    <ellipse cx="340" cy="720" rx="14" ry="20" transform="rotate(-20 340 720)"/>
    <ellipse cx="366" cy="720" rx="14" ry="20" transform="rotate(20 366 720)"/>
  </g>
  <g fill="#e7c98a" opacity="0.9">
    <ellipse cx="700" cy="900" rx="12" ry="17" transform="rotate(-20 700 900)"/>
    <ellipse cx="722" cy="900" rx="12" ry="17" transform="rotate(20 722 900)"/>
  </g>

  <!-- fireflies across the whole frame -->
  <g fill="#ffe6a0">
    <circle cx="230" cy="640" r="6"/><circle cx="470" cy="560" r="5"/><circle cx="600" cy="700" r="6"/>
    <circle cx="820" cy="620" r="5"/><circle cx="360" cy="880" r="6"/><circle cx="700" cy="1040" r="6"/>
    <circle cx="150" cy="900" r="5"/><circle cx="900" cy="980" r="5"/><circle cx="520" cy="980" r="6"/>
    <circle cx="410" cy="1080" r="5"/><circle cx="260" cy="1050" r="5"/><circle cx="640" cy="500" r="5"/>
  </g>

  <!-- QUIET ZONE for the game board: keep this area calm & darker (no text in the render) -->
  <rect x="70" y="470" width="884" height="720" rx="48" fill="#060810" opacity="0.36"/>

  <!-- edge vignette -->
  <rect width="1024" height="1536" fill="url(#vig)"/>
</svg>
